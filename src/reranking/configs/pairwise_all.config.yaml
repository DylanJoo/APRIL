data:
  ir_datasets_name: msmarco-passage/trec-dl-2019/judged
  input_run: ../../runs/run.msmarco-v1-passage.bm25-trec-dl-2019.txt

llm:
  model_name_or_path: Qwen/Qwen2.5-7B-Instruct
  temperature: 0.0
  top_p: 1.0
  backend: vllm

rerank_mode: Pairwise
aggregation: symsum
top_k: 100 
rank_start: 0
rank_end: 50

max_length: 10240
context_size: 2048
window_size: 20
step_size: 10

output_run: ../../runs/temp.txt
save_path: ./checkpoints/model.pt
log_dir: ./logs
