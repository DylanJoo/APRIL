# Configuration for Judge mode (LLM-as-a-Judge)
# Supports multiple scoring modes and computation methods

data:
  batch_size: 32
  ir_datasets_name: msmarco-passage/trec-dl-2019/judged
  input_run: runs/run.msmarco-passage.bm25-trec-dl-2019.txt

llm:
  model_name_or_path: Qwen/Qwen2.5-7B-Instruct
  temperature: 0.0
  top_p: 1.0
  backend: vllm
  max_model_len: 8196
  dtype: float16
  use_logits: true
  base_url: null
  api_key: null

# Rerank mode: Judge, JudgeFewShot, or JudgeEnsemble
rerank_mode: Judge

# Standard reranking settings
use_alphabetical: false
top_k: 100
rank_start: 0
rank_end: 100
max_doc_length: null
context_size: 1024
window_size: null
step_size: null
exp: judge
num_runs: 1
dtype: float16
variable_passages: false
include_system_message: true
system_message: "You are JudgeLLM, an intelligent assistant that can judge the relevance of passages to queries."

# Judge-specific settings
# Scoring mode: 'binary', 'rating', or 'rubric_binary'
scoring_mode: binary

# Scoring computation method:
# - 'binary_probs': P(Yes) / (P(Yes) + P(No))
# - 'peak_likelihood': logP(target_rating) or exp(logP(target_rating))
# - 'normalized_softmax': softmax over selected rating tokens
# - 'expected_rating': weighted sum of P(rating) * rating
# - 'rubric_binary': binary with rubric context
scoring_computation: binary_probs

# Rating scale (0 to rating_scale, default 0-5)
rating_scale: 5

# Rating threshold for rubric_binary mode
rating_threshold: 3

# Target ratings for peak_likelihood and normalized_softmax modes
# Examples: [5] for peak only, [4, 5] for high relevance, [3, 4, 5] for medium+
target_ratings: null

# Whether to use log scale for peak_likelihood output
use_log_scale: false

# Whether to include the rating rubric in prompts
include_rubric: true

# Custom rubric (optional, uses default if null)
rubric: null

# Few-shot reference settings (for JudgeFewShot mode)
num_references: 0

# Reference structure: 'positive_only', 'with_negative', 'tight', 'pseudo'
reference_structure: positive_only

# Ensemble settings (for JudgeEnsemble mode)
ensemble_methods: null  # e.g., ['binary_probs', 'expected_rating']
ensemble_weights: null  # e.g., [0.5, 0.5]

result_parser_name: judge
