data:
  batch_size: 32
  ir_datasets_name: msmarco-passage/trec-dl-2019/judged
  input_run: runs/run.msmarco-passage.bm25-trec-dl-2019.txt

llm:
  model_name_or_path: Qwen/Qwen2.5-7B-Instruct
  temperature: 0.0
  top_p: 1.0
  backend: vllm
  max_model_len: 8196
  dtype: float16
  use_logits: false
  base_url: null
  api_key: null

# Base reranking configuration
rerank_mode: RankGPT 
use_alphabetical: false
top_k: 100 
rank_start: 0
rank_end: 100 
max_doc_length: null
context_size: 1024
window_size: 20
step_size: 10
exp: extended
num_runs: 1
dtype: float16
variable_passages: true
include_system_message: true
system_message: "You are RankLLM, an intelligent assistant that can rank passages based on their relevancy to the query"
result_parser_name: listwise

# Pre-ranking: Query decomposition configuration
# Options: passthrough, llm
decomposer: passthrough
decomposer_config:
  # For LLM decomposer
  max_sub_queries: 4
  min_sub_queries: 1
  # Custom prompt template (optional)
  # prompt_template: "..."

# Post-ranking: Result aggregation configuration  
# Options: passthrough, rrf, coverage, mmr
aggregator: rrf
aggregator_config:
  # For RRF aggregator
  k: 60
  # For Coverage aggregator
  # coverage_weight: 0.5
  # top_k: 100
  # normalize_scores: true
  # For MMR aggregator
  # lambda_param: 0.7
  # top_k: 100
